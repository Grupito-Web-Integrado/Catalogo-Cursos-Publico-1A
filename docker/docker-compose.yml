services:
  # =========================================================
  # POSTGRESQL
  # =========================================================
  postgres:
    image: postgres:16
    container_name: catalogo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # ELASTICSEARCH
  # =========================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: catalogo-elasticsearch
    restart: unless-stopped

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================================
  # REDIS
  # =========================================================
  redis:
    image: redis:7
    container_name: catalogo-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # JAEGER
  # =========================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: catalogo-jaeger
    restart: unless-stopped

    environment:
      - COLLECTOR_OTLP_ENABLED=true

    ports:
      # Jaeger UI
      - "16686:16686"

      # OTLP gRPC
      - "4317:4317"

      # OTLP HTTP
      - "4318:4318"

# ===========================================================
# VOLUMES
# ===========================================================

volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:
