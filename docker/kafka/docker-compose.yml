# docker-compose.kafka.yml

services:
  # =========================================================
  # KAFKA BROKER 1
  # =========================================================
  kafka-1:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-1
    hostname: kafka-1
    restart: unless-stopped

    ports:
      - "9092:9092"

    networks:
      - kafka_network

    environment:
      # -------------------------------------------------------
      # KRaft
      # -------------------------------------------------------
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # -------------------------------------------------------
      # Listeners
      # -------------------------------------------------------
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # -------------------------------------------------------
      # Replication
      # -------------------------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # -------------------------------------------------------
      # Storage
      # -------------------------------------------------------
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_1_data:/var/lib/kafka/data

  # =========================================================
  # KAFKA BROKER 2
  # =========================================================
  kafka-2:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-2
    hostname: kafka-2
    restart: unless-stopped

    ports:
      - "9093:9092"

    networks:
      - kafka_network

    environment:
      # -------------------------------------------------------
      # KRaft
      # -------------------------------------------------------
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # -------------------------------------------------------
      # Listeners
      # -------------------------------------------------------
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # -------------------------------------------------------
      # Replication
      # -------------------------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # -------------------------------------------------------
      # Storage
      # -------------------------------------------------------
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_2_data:/var/lib/kafka/data

  # =========================================================
  # KAFKA BROKER 3
  # =========================================================
  kafka-3:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-3
    hostname: kafka-3
    restart: unless-stopped

    ports:
      - "9094:9092"

    networks:
      - kafka_network

    environment:
      # -------------------------------------------------------
      # KRaft
      # -------------------------------------------------------
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # -------------------------------------------------------
      # Listeners
      # -------------------------------------------------------
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # -------------------------------------------------------
      # Replication
      # -------------------------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # -------------------------------------------------------
      # Storage
      # -------------------------------------------------------
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_3_data:/var/lib/kafka/data

  # =========================================================
  # KAFKA CONNECT + DEBEZIUM
  # =========================================================
  kafka-connect:
    image: debezium/connect:2.6
    container_name: kafka-connect
    hostname: kafka-connect
    restart: unless-stopped

    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

    ports:
      - "8083:8083"

    networks:
      - kafka_network

    environment:
      # -------------------------------------------------------
      # Kafka
      # -------------------------------------------------------
      BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092

      GROUP_ID: connect-cluster

      # -------------------------------------------------------
      # Kafka Connect internal topics
      # -------------------------------------------------------
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status

      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3

      # -------------------------------------------------------
      # Converters
      # -------------------------------------------------------
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      # -------------------------------------------------------
      # REST
      # -------------------------------------------------------
      REST_ADVERTISED_HOST_NAME: kafka-connect
      REST_PORT: 8083

      # -------------------------------------------------------
      # Plugins
      # -------------------------------------------------------
      PLUGIN_PATH: /kafka/connect,/usr/share/java

  # =========================================================
  # KAFKA UI
  # =========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped

    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - kafka-connect

    ports:
      - "8090:8080"

    networks:
      - kafka_network

    environment:
      # -------------------------------------------------------
      # Kafka cluster
      # -------------------------------------------------------
      KAFKA_CLUSTERS_0_NAME: local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092

      # -------------------------------------------------------
      # Kafka Connect / Debezium
      # -------------------------------------------------------
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium

      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

# =========================================================
# NETWORK
# =========================================================

networks:
  kafka_network:
    name: kafka_network
    driver: bridge

# =========================================================
# VOLUMES
# =========================================================

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
