spring:
  application:
    name: Catalogo-Cursos

  # =========================================================
  # R2DBC
  # =========================================================
  r2dbc:
    url: r2dbc:postgresql://localhost:5435/catalog_db
    username: admin
    password: admin

  # =========================================================
  # FLYWAY
  # =========================================================
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5435/catalog_db
    user: admin
    password: admin

  # =========================================================
  # ELASTICSEARCH
  # =========================================================
  elasticsearch:
    uris: http://localhost:9200
    compatibility-mode: true

  # =========================================================
  # REDIS
  # =========================================================
  data:
    redis:
      host: localhost
      port: 6379

# ===========================================================
# MANAGEMENT
# ===========================================================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

  tracing:
    enabled: false
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://localhost:4317
